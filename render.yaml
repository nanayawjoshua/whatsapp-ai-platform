# Render Blueprint for Beeline Ghana Cloud Bridge
# Deploy with: "Connect to GitHub" on render.com
# Docs: https://render.com/docs/blueprint-spec

services:
  # WhatsApp Bridge Service (Baileys Multi-Session)
  - type: web
    name: beeline-bridge
    env: docker
    plan: starter  # $7/month - 512MB RAM (can handle 12 vendors, scale up as needed)
    region: oregon  # Closest to Ghana with good latency
    dockerfilePath: ./cloud/Dockerfile
    dockerContext: ./cloud

    # Health check (Render pings this every 30s)
    healthCheckPath: /health

    # Auto-deploy from GitHub
    branch: cloud-hybrid

    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production

      # n8n webhook URL (same as current setup)
      - key: N8N_WEBHOOK_URL
        sync: false  # Set manually in Render dashboard

      # PostgreSQL connection (auto-generated by Render)
      - key: DATABASE_URL
        fromDatabase:
          name: beeline-postgres
          property: connectionString

      # Redis URL (Upstash free tier)
      - key: REDIS_URL
        sync: false  # Set manually: redis://default:password@host:port

      # Groq API key (fallback if n8n fails)
      - key: GROQ_API_KEY
        sync: false

      # Log level
      - key: LOG_LEVEL
        value: info

      # Session capacity per instance
      - key: MAX_VENDORS
        value: 75

      # CloudFlare Tunnel credentials (for Pi backup)
      - key: CLOUDFLARE_TUNNEL_TOKEN
        sync: false

databases:
  # PostgreSQL (Free tier: 1GB storage, 97 hours/month compute)
  - name: beeline-postgres
    plan: free
    databaseName: beeline
    user: beeline
    region: oregon

    # Initial schema will be applied via migration script
    # See: cloud/migrations/001_initial_schema.sql

# Redis is NOT available as a Render service - use Upstash instead:
# 1. Go to https://upstash.com (free tier: 10k commands/day)
# 2. Create Redis database
# 3. Copy connection string to REDIS_URL env var

# Cost Breakdown:
# - Web service: $7/month (starter plan - 512MB RAM)
# - PostgreSQL: $0 (free tier)
# - Redis (Upstash): $0 (free tier)
# - Total: $7/month
#
# Scaling:
# - 75 vendors = $7/month (1 instance)
# - 150 vendors = $14/month (2 instances via horizontal scaling)
# - 1000 vendors = ~$100/month (14 instances)

# Deployment Steps:
# 1. Push cloud-hybrid branch to GitHub
# 2. Go to render.com → New → Blueprint
# 3. Connect GitHub repo
# 4. Select branch: cloud-hybrid
# 5. Set environment variables (N8N_WEBHOOK_URL, REDIS_URL, etc.)
# 6. Deploy!
# 7. Update Pi to forward messages to: https://beeline-bridge.onrender.com/webhook

# Monitoring:
# - Render dashboard shows logs, metrics, health checks
# - Set up alerts for downtime (email/Slack)
# - Use `render logs` CLI for real-time monitoring
