<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beeline Logo Concept 1 - Geometric Minimalist</title>
    <style>
        body {
            margin: 0;
            padding: 60px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .logo-container {
            background: white;
            padding: 80px;
            border-radius: 32px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.3);
            text-align: center;
        }

        .logo {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 40px;
        }

        /* Hexagon Base */
        .hexagon {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .hexagon svg {
            width: 100%;
            height: 100%;
        }

        /* Bee Stripes - Minimalist Lines */
        .bee-stripes {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 140px;
        }

        .stripe {
            position: absolute;
            width: 100%;
            height: 18px;
            background: #FFB800;
            border-radius: 20px;
        }

        .stripe:nth-child(1) { top: 20px; }
        .stripe:nth-child(2) { top: 60px; }
        .stripe:nth-child(3) { top: 100px; }

        /* Wings - Abstract Geometric */
        .wings {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
        }

        .wing {
            position: absolute;
            width: 80px;
            height: 60px;
            background: rgba(255, 184, 0, 0.15);
            border: 3px solid #FFB800;
            border-radius: 50% 50% 50% 0;
            transform-origin: bottom right;
        }

        .wing-left {
            left: 10px;
            top: 60px;
            transform: rotate(-25deg);
        }

        .wing-right {
            right: 10px;
            top: 60px;
            transform: rotate(25deg) scaleX(-1);
        }

        /* Brand Name */
        .brand-name {
            font-size: 48px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }

        .tagline {
            font-size: 16px;
            color: #666;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Variants Display */
        .variants {
            margin-top: 60px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .variant {
            padding: 30px;
            border-radius: 16px;
            background: #f5f5f5;
        }

        .variant-title {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .variant-logo {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            position: relative;
        }

        /* Dark variant */
        .variant.dark {
            background: #1a1a1a;
        }

        .variant.dark .variant-title {
            color: #666;
        }

        .variant.dark .hexagon path {
            fill: #FFB800;
        }

        .variant.dark .stripe {
            background: #1a1a1a;
        }

        .variant.dark .wing {
            border-color: #1a1a1a;
            background: rgba(26, 26, 26, 0.3);
        }

        /* Monochrome variant */
        .variant.mono .hexagon path {
            fill: #1a1a1a;
        }

        .variant.mono .stripe {
            background: white;
        }

        .variant.mono .wing {
            border-color: white;
            background: rgba(255, 255, 255, 0.2);
        }

        /* White variant */
        .variant.white {
            background: white;
            border: 2px solid #e0e0e0;
        }

        .variant.white .hexagon path {
            fill: white;
            stroke: #FFB800;
            stroke-width: 4;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="logo">
            <div class="hexagon">
                <svg viewBox="0 0 100 100">
                    <path d="M50 5 L90 30 L90 70 L50 95 L10 70 L10 30 Z"
                          fill="#FFB800" stroke="none"/>
                </svg>
            </div>
            <div class="wings">
                <div class="wing wing-left"></div>
                <div class="wing wing-right"></div>
            </div>
            <div class="bee-stripes">
                <div class="stripe"></div>
                <div class="stripe"></div>
                <div class="stripe"></div>
            </div>
        </div>

        <div class="brand-name">Beeline</div>
        <div class="tagline">WhatsApp AI Platform</div>

        <div class="variants">
            <div class="variant dark">
                <div class="variant-title">Dark Mode</div>
                <div class="variant-logo">
                    <div class="hexagon">
                        <svg viewBox="0 0 100 100">
                            <path d="M50 5 L90 30 L90 70 L50 95 L10 70 L10 30 Z"
                                  fill="#FFB800" stroke="none"/>
                        </svg>
                    </div>
                    <div class="wings" style="width: 80px; height: 80px;">
                        <div class="wing wing-left" style="width: 32px; height: 24px; border-width: 2px;"></div>
                        <div class="wing wing-right" style="width: 32px; height: 24px; border-width: 2px;"></div>
                    </div>
                    <div class="bee-stripes" style="width: 56px; height: 56px;">
                        <div class="stripe" style="height: 7px; top: 8px;"></div>
                        <div class="stripe" style="height: 7px; top: 24px;"></div>
                        <div class="stripe" style="height: 7px; top: 40px;"></div>
                    </div>
                </div>
            </div>

            <div class="variant mono">
                <div class="variant-title">Monochrome</div>
                <div class="variant-logo">
                    <div class="hexagon">
                        <svg viewBox="0 0 100 100">
                            <path d="M50 5 L90 30 L90 70 L50 95 L10 70 L10 30 Z"
                                  fill="#1a1a1a" stroke="none"/>
                        </svg>
                    </div>
                    <div class="wings" style="width: 80px; height: 80px;">
                        <div class="wing wing-left" style="width: 32px; height: 24px; border-width: 2px;"></div>
                        <div class="wing wing-right" style="width: 32px; height: 24px; border-width: 2px;"></div>
                    </div>
                    <div class="bee-stripes" style="width: 56px; height: 56px;">
                        <div class="stripe" style="height: 7px; top: 8px;"></div>
                        <div class="stripe" style="height: 7px; top: 24px;"></div>
                        <div class="stripe" style="height: 7px; top: 40px;"></div>
                    </div>
                </div>
            </div>

            <div class="variant white">
                <div class="variant-title">Outline</div>
                <div class="variant-logo">
                    <div class="hexagon">
                        <svg viewBox="0 0 100 100">
                            <path d="M50 5 L90 30 L90 70 L50 95 L10 70 L10 30 Z"
                                  fill="white" stroke="#FFB800" stroke-width="4"/>
                        </svg>
                    </div>
                    <div class="wings" style="width: 80px; height: 80px;">
                        <div class="wing wing-left" style="width: 32px; height: 24px; border-width: 2px;"></div>
                        <div class="wing wing-right" style="width: 32px; height: 24px; border-width: 2px;"></div>
                    </div>
                    <div class="bee-stripes" style="width: 56px; height: 56px;">
                        <div class="stripe" style="height: 7px; top: 8px;"></div>
                        <div class="stripe" style="height: 7px; top: 24px;"></div>
                        <div class="stripe" style="height: 7px; top: 40px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
